[project]
name = "auvylen-inference"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "auvylen-contracts",
    "numpy>=2.3,<3",
    "onnxruntime==1.31.0",
    "pillow>=12,<13",
]

[tool.uv.sources]
auvylen-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aevyra_inference"]
