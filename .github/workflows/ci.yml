name: Auvylen foundation, commercial and deployment checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cloud-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/create-cloud-test-env.py
      - run: docker compose --env-file .env.cloud.local -p auvylen-phase4a-test -f docker-compose.prod.yml -f docker-compose.cloud.yml -f docker-compose.cloud.local.yml --profile research build
      - run: docker compose --env-file .env.cloud.local -p auvylen-phase4a-test -f docker-compose.prod.yml -f docker-compose.cloud.yml -f docker-compose.cloud.local.yml --profile research up -d --wait
      - run: npm ci
      - run: npm exec --workspace @auvylen/web -- playwright install --with-deps chromium
      - run: npm exec --workspace @auvylen/web -- playwright test --config playwright.cloud.config.ts
      - if: always()
        run: docker compose --env-file .env.cloud.local -p auvylen-phase4a-test -f docker-compose.prod.yml -f docker-compose.cloud.yml -f docker-compose.cloud.local.yml --profile research down
  backend:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      ATEN_CPU_CAPABILITY: "default"
      REDEMPTION_CODE_PEPPER: ci-testing-only-secret-not-for-deployment
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: aevyra
          POSTGRES_PASSWORD: aevyra_dev_only
          POSTGRES_DB: aevyra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aevyra -d aevyra"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic -c services/api/alembic.ini upgrade head
      # Review-pinned CPU toolchain/weights, in an isolated environment, never in Git.
      - name: Export reviewed weights in pinned Debian/Python environment
        run: |
          mkdir -p private-data/exports
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD/scripts,dst=/scripts,readonly" \
            --mount "type=bind,src=$PWD/private-data/exports,dst=/output" \
            -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 -e ATEN_CPU_CAPABILITY=default \
            -e TORCHINDUCTOR_CACHE_DIR=/tmp/auvylen-export-cache \
            python:3.14.8-slim-trixie@sha256:fbecd461fc72d21b2143c6eaba25143738079154a6d0ea3da3aec724f50eed4a \
            sh -eu -c '
              python -m venv /tmp/export-env
              /tmp/export-env/bin/pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch==2.10.0+cpu" "torchvision==0.25.0+cpu"
              /tmp/export-env/bin/pip install --no-cache-dir "timm==1.0.30" "onnx==1.22.0" "numpy==2.5.4"
              /tmp/export-env/bin/python /scripts/export-pretrained-extractor.py --download --diagnose --output /output/mobilenetv3-small-100-lamb-embedding-v1.onnx
            '
      - run: uv run python scripts/install-pretrained-extractor.py --source-file private-data/exports/mobilenetv3-small-100-lamb-embedding-v1.onnx --root private-data/models/pretrained
      # The built Next.js proxy test runs in commercial-browser below.
      - run: uv run pytest --integration --pretrained --pretrained-root private-data/models/pretrained --ignore=services/api/tests/test_codespaces_login_proxy.py
      - run: uv run alembic -c services/api/alembic.ini check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm exec --workspace @auvylen/web -- next typegen
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  commercial-browser:
    runs-on: ubuntu-latest
    env:
      E2E_RESEARCH: "true"
      REDEMPTION_CODE_PEPPER: ci-testing-only-secret-not-for-deployment
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: aevyra
          POSTGRES_PASSWORD: aevyra_dev_only
          POSTGRES_DB: aevyra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aevyra -d aevyra"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: uv run alembic -c services/api/alembic.ini upgrade head
      - run: npm run build
      - run: uv run pytest --integration services/api/tests/test_codespaces_login_proxy.py
      - run: npm exec --workspace @auvylen/web -- playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @auvylen/web
      # Phase 6: the aesthetic pipeline with a SYNTHETIC generated-data checkpoint (dev/test only).
      - run: uv run python scripts/create-test-aesthetic-checkpoint.py --model-root private-data/e2e-models >> "$GITHUB_ENV"
      - run: npm run test:e2e --workspace @auvylen/web -- aesthetic
  deployment:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: aevyra-phase2
      COMPOSE_FILE: docker-compose.prod.yml:docker-compose.prod.local.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import secrets
          password = secrets.token_hex(32)
          text = Path('.env.production.example').read_text()
          text = text.replace('your-domain.example', 'localhost')
          text = text.replace('POSTGRES_PASSWORD=\n', f'POSTGRES_PASSWORD={password}\n')
          text = text.replace('DATABASE_URL=\n', f'DATABASE_URL=postgresql+psycopg://aevyra:{password}@postgres:5432/aevyra\n')
          text = text.replace('REPLACE_WITH_SECURE_RANDOM_SECRET', secrets.token_hex(48))
          text = text.replace('CORS_ORIGINS=[]', 'CORS_ORIGINS=["https://localhost:8443"]')
          Path('.env.production.local').write_text(text)
          PY
      - run: docker compose --env-file .env.production.local build
      - run: docker compose --env-file .env.production.local up -d --wait postgres redis
      - run: docker compose --env-file .env.production.local run --rm --no-deps api alembic -c services/api/alembic.ini upgrade head
      - run: docker compose --env-file .env.production.local run --rm --no-deps api alembic -c services/api/alembic.ini check
      - run: docker compose --env-file .env.production.local up -d --wait
      - run: npm ci
      - run: npm exec --workspace @auvylen/web -- playwright install --with-deps chromium
      - run: npm exec --workspace @auvylen/web -- playwright test --config playwright.deployment.config.ts
        env:
          AEVYRA_TEST_MODE: production
      - run: |
          sed -i 's/APP_ENV=production/APP_ENV=staging/' .env.production.local
          docker compose --env-file .env.production.local up -d --wait
      - run: npm exec --workspace @auvylen/web -- playwright test --config playwright.deployment.config.ts
      - if: always()
        run: docker compose --env-file .env.production.local down
