[project]
name = "auvylen"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["auvylen-api", "auvylen-inference", "auvylen-contracts"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api", "services/inference", "packages/contracts"]

[tool.uv.sources]
auvylen-api = { workspace = true }
auvylen-inference = { workspace = true }
auvylen-contracts = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "mypy>=1.15",
    "httpx2>=2.13.1",
]

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "services/inference/tests"]
markers = ["integration: requires real PostgreSQL and Redis (opt in with --integration)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services/api/src", "services/inference/src", "packages/contracts/src"]
