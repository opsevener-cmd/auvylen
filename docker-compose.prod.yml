name: aevyra-prod
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
# Shared by api and worker. Research, private storage and limits come from the env file;
# every limit default equals the application's own default (asserted by a unit test).
x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL explicitly}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL explicitly}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS explicitly, e.g. []}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
  REDEMPTION_CODE_PEPPER: ${REDEMPTION_CODE_PEPPER:?Set and securely back up REDEMPTION_CODE_PEPPER}
  SESSION_COOKIE_SECURE: "true"
  SESSION_LIFETIME_SECONDS: ${SESSION_LIFETIME_SECONDS:-86400}
  SHARED_PROXY_RATE_LIMITS: "true"
  RESEARCH_MODE: ${RESEARCH_MODE:-false}
  ENABLED_MODEL_PROVIDERS: ${ENABLED_MODEL_PROVIDERS:-[]}
  PRIVATE_UPLOAD_ROOT: /var/lib/auvylen/uploads
  PRIVATE_MODEL_ROOT: /var/lib/auvylen/models
  RESEARCH_MAX_PENDING: ${RESEARCH_MAX_PENDING:-2}
  RESEARCH_DAILY_LIMIT: ${RESEARCH_DAILY_LIMIT:-50}
  RESEARCH_MAX_RUNNING: ${RESEARCH_MAX_RUNNING:-1}
  OWNER_MAX_PROJECTS: ${OWNER_MAX_PROJECTS:-100}
  OWNER_MAX_DATASETS: ${OWNER_MAX_DATASETS:-300}
  OWNER_MAX_IMAGES: ${OWNER_MAX_IMAGES:-1000}
  OWNER_STORAGE_MIB: ${OWNER_STORAGE_MIB:-2048}
  OWNER_MAX_PAIRS: ${OWNER_MAX_PAIRS:-50000}
  OWNER_MAX_MODELS: ${OWNER_MAX_MODELS:-300}
  OWNER_MAX_PENDING: ${OWNER_MAX_PENDING:-4}
  OWNER_DAILY_LIMIT: ${OWNER_DAILY_LIMIT:-200}
  OWNER_FRESH_AUTH_SECONDS: ${OWNER_FRESH_AUTH_SECONDS:-600}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
  STUDY_MAX_PHOTOS: ${STUDY_MAX_PHOTOS:-200}
  # Phase 6 aesthetic model: off until a validated checkpoint is installed and pinned.
  AESTHETIC_SCORING_ENABLED: ${AESTHETIC_SCORING_ENABLED:-false}
  AESTHETIC_MODEL_VERSION: ${AESTHETIC_MODEL_VERSION:-}
  AESTHETIC_MANIFEST_SHA256: ${AESTHETIC_MANIFEST_SHA256:-}
  # Free photo check (docs/photo-check.md): off until enabled with a paid-tier Gemini key.
  FREE_HOOK_ENABLED: ${FREE_HOOK_ENABLED:-false}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  FREE_HOOK_PAID_TIER_CONFIRMED: ${FREE_HOOK_PAID_TIER_CONFIRMED:-false}
  FREE_HOOK_MODEL: ${FREE_HOOK_MODEL:-gemini-3.5-flash-lite}
  # Quota: lifetime free checks per account, then free checks per week, then Credits.
  PHOTO_CHECK_FREE_SIGNUP: ${PHOTO_CHECK_FREE_SIGNUP:-3}
  PHOTO_CHECK_FREE_WEEKLY: ${PHOTO_CHECK_FREE_WEEKLY:-1}
  PHOTO_CHECK_CREDIT_COST: ${PHOTO_CHECK_CREDIT_COST:-1}
  FREE_HOOK_DAILY_BUDGET_USD: ${FREE_HOOK_DAILY_BUDGET_USD:-3.00}
  FREE_HOOK_PRICE_INPUT_PER_M: ${FREE_HOOK_PRICE_INPUT_PER_M:-0.30}
  FREE_HOOK_PRICE_OUTPUT_PER_M: ${FREE_HOOK_PRICE_OUTPUT_PER_M:-2.50}
  FREE_HOOK_THINKING_LEVEL: ${FREE_HOOK_THINKING_LEVEL:-minimal}
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  # Fewer glibc malloc arenas: threadpool request handlers otherwise fragment the heap.
  MALLOC_ARENA_MAX: "2"
# Memory budget for a 2 vCPU / 4 GB host (measured idle total ~0.4 GB). Every service has a
# hard limit so one runaway process cannot starve the others; the sum stays below RAM.
services:
  web:
    image: auvylen-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_URL: ${API_URL:-http://api:8000}
      # Unfinished pages (aesthetic, native preview) stay hidden unless explicitly "true".
      # Synthetic analysis and mock checkout are never shown in production.
      PREVIEW_FEATURES_ENABLED: ${PREVIEW_FEATURES_ENABLED:-}
      NODE_OPTIONS: --max-old-space-size=256
      NO_PROXY: localhost,127.0.0.1,::1,api
      no_proxy: localhost,127.0.0.1,::1,api
    mem_limit: 384m
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    networks: [app]
    depends_on:
      api: {condition: service_healthy}
  api:
    image: auvylen-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment: *app-environment
    # Private uploads and models (UID 10001). Never mounted in web or proxy.
    volumes: [auvylen_private:/var/lib/auvylen]
    # Upload decoding happens here; the API never loads numpy/ONNX at startup.
    mem_limit: 512m
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    networks: [app, data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  # Research jobs (personal model training/prediction, retention cleanup) run here, outside
  # HTTP requests. Opt in with --profile research; it exits unless RESEARCH_MODE=true.
  worker:
    image: auvylen-api:${IMAGE_TAG:-local}
    profiles: [research]
    environment:
      <<: *app-environment
      WORKER_QUEUE: cpu
    command: [python, -m, aevyra_api.research.worker]
    volumes: [auvylen_private:/var/lib/auvylen]
    healthcheck:
      test: [CMD, python, -c, "import time; from pathlib import Path; p=Path('/tmp/auvylen-worker-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime < 30"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # ONNX/MobileNet is loaded per job and released afterwards.
    mem_limit: 512m
    cpus: 1.0
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aevyra}
      POSTGRES_DB: ${POSTGRES_DB:-aevyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
    # Sized for the 4 GB host. Pools: API and worker use SQLAlchemy defaults (5 + 10 overflow
    # each) plus a few operator/migration CLIs, so 50 connections leave headroom.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=1GB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    volumes: [postgres_data:/var/lib/postgresql]
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *logging
    networks: [data]
  redis:
    image: redis:8-alpine
    # No business state or queue exists yet: intentionally disposable cache.
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    mem_limit: 256m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *logging
    networks: [data]
  proxy:
    image: caddy:2-alpine
    environment:
      AEVYRA_DOMAIN: ${AEVYRA_DOMAIN:?Set the public hostname without a scheme or path}
      # Internal Compose traffic must not use a managed host's outbound proxy.
      NO_PROXY: localhost,127.0.0.1,::1,api,web
      no_proxy: localhost,127.0.0.1,::1,api,web
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/routes.caddy:/etc/caddy/routes.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    healthcheck:
      # BusyBox wget otherwise proxies even this container-local health request.
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, http://127.0.0.1:2019/config/]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *logging
    networks: [app]
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
networks:
  app:
  data:
    internal: true
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  # Initialized from the API image, so a new volume starts owned by UID 10001.
  auvylen_private:
